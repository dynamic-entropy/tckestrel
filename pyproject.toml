[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tckestrel"
version = "0.1.0"
description = "HTCondor fleet controller for xrdhover WAN-hold campaigns"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pyyaml",
]

[project.scripts]
tckestrel = "tckestrel.cli:main"

[dependency-groups]
dev = ["pytest", "rucio-clients>=41.2.0", "htcondor>=24"]

[tool.hatch.build.targets.wheel]
packages = ["src/tckestrel"]

[tool.hatch.build.targets.wheel.force-include]
"src/tckestrel/rucio.cfg" = "tckestrel/rucio.cfg"
"src/tckestrel/run_xrdhover.sh" = "tckestrel/run_xrdhover.sh"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
